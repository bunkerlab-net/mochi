name: Build snapshot of PR

on: pull_request

permissions: {}

env:
  REGISTRY_IMAGE: ghcr.io/bunkerlab-net/mochi

jobs:
  build:
    name: Build snapshot ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform_pair: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_pair: linux-arm64
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: type=ref,event=pr

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: latest
          cache-binary: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Get current time
        id: current-time
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          outputs: type=docker,dest=/tmp/image-${{ matrix.platform_pair }}.tar
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.platform_pair }}
          cache-from: type=gha,scope=pr-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.platform_pair }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.current-time.outputs.time }}

      - name: Export Docker meta output
        shell: bash
        run: echo "$DOCKER_METADATA_OUTPUT_JSON" > /tmp/metadata.json

      - name: Upload metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata
          path: /tmp/metadata.json
          overwrite: true

      - name: Export SHA
        run: |
          echo "${{ github.sha }}" > /tmp/sha.txt

      - name: Upload SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha
          path: /tmp/sha.txt
          overwrite: true

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.platform_pair }}
          path: /tmp/image-${{ matrix.platform_pair }}.tar
          if-no-files-found: error
          retention-days: 1

      - name: Save PR number in artifact
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "$PR_NUMBER" > /tmp/pull_request_number.txt
      - name: Upload PR number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull_request_number
          path: /tmp/pull_request_number.txt
          overwrite: true

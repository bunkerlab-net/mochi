name: Build snapshot of PR

on: pull_request

permissions: {}

env:
  REGISTRY_IMAGE: ghcr.io/bunkerlab-net/mochi

jobs:
  build:
    name: Build snapshot ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform_pair: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_pair: linux-arm64
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: type=ref,event=pr

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current time
        id: current-time
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          outputs: type=docker,dest=/tmp/image-${{ matrix.platform_pair }}.tar
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.platform_pair }}
          cache-from: type=gha,scope=pr-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.platform_pair }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.current-time.outputs.time }}

      - name: Export Docker meta output
        shell: bash
        run: echo "$DOCKER_METADATA_OUTPUT_JSON" > /tmp/metadata.json

      - name: Upload metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata
          path: /tmp/metadata.json
          overwrite: true

      - name: Export SHA
        run: |
          echo "${{ github.sha }}" > /tmp/sha.txt

      - name: Upload SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha
          path: /tmp/sha.txt
          overwrite: true

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.platform_pair }}
          path: /tmp/image-${{ matrix.platform_pair }}.tar
          if-no-files-found: error
          retention-days: 1

      - name: Save PR number in artifact
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "$PR_NUMBER" > /tmp/pull_request_number.txt
      - name: Upload PR number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull_request_number
          path: /tmp/pull_request_number.txt
          overwrite: true

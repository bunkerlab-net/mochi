name: Release snapshot of PR
on: # zizmor: ignore[dangerous-triggers] deliberate build-on-PR (no secrets) -> release-on-workflow_run (with secrets) split; artifact-sourced SHA & PR number are format-validated before use
  workflow_run:
    workflows: ["Build snapshot of PR"]
    types:
      - completed

env:
  REGISTRY_IMAGE: ghcr.io/bunkerlab-net/mochi

permissions: {}

jobs:
  release-and-comment:
    name: Release snapshot and comment in PR
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: write
      attestations: write
      id-token: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: latest
          cache-binary: false

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/images
          pattern: image-linux-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Load image
        shell: bash
        run: |
          docker load -i /tmp/images/image-linux-amd64.tar
          docker load -i /tmp/images/image-linux-arm64.tar

      - name: Download SHA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/SHA
          name: sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read SHA
        id: read-sha
        shell: bash
        run: |
          sha="$(tr -d '\n' < /tmp/SHA/sha.txt)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Invalid commit SHA in artifact: ${sha}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Push images
        env:
          SHA: ${{ steps.read-sha.outputs.sha }}
        run: |
          docker push "${REGISTRY_IMAGE}:${SHA}-linux-amd64"
          docker push "${REGISTRY_IMAGE}:${SHA}-linux-arm64"

      - name: Download Docker metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/metadata
          name: metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read the metadata.json file
        id: metadata_reader
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1.1.8
        with:
          path: /tmp/metadata/metadata.json

      - name: Download PR number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/pull_request_number
          name: pull_request_number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR number
        id: read-pr-number
        shell: bash
        run: |
          pr_number="$(tr -d '\n' < /tmp/pull_request_number/pull_request_number.txt)"
          if [[ ! "${pr_number}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number in artifact: ${pr_number}" >&2
            exit 1
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        env:
          SHA: ${{ steps.read-sha.outputs.sha }}
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' /tmp/metadata/metadata.json)"
          docker buildx imagetools create ${tags} "${REGISTRY_IMAGE}:${SHA}-linux-amd64" "${REGISTRY_IMAGE}:${SHA}-linux-arm64"

      - name: Create comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: "pr-release"
          number: ${{ steps.read-pr-number.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            #### :package: :robot: A new release has been made for this pull request.

            To play around with this PR, pull `${{ env.REGISTRY_IMAGE }}:pr-${{ steps.read-pr-number.outputs.pr_number }}`.

            Images are available for x86_64 and ARM64.

            > Latest commit: ${{ steps.read-sha.outputs.sha }}

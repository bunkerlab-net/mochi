name: Make release & publish Docker image

on:
  push:
    tags:
      - "v*"
  # Manual fallback: run "Run workflow" from a release tag ref (e.g. v3.0.1) to
  # (re)publish that release if the tag-push trigger was ever missed.
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/bunkerlab-net/mochi

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: latest
          cache-binary: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Get current time
        id: current-time
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.arch }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.current-time.outputs.time }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: latest
          cache-binary: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Docker meta (GitHub Container Registry)
        id: meta-ghcr
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Create manifest list and push (GitHub Container Registry)
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta-ghcr.outputs.tags }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              tag_args+=(-t "${tag}")
            fi
          done <<< "${TAGS}"
          source_args=()
          for digest in *; do
            source_args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: merge
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Get Changelog Entry
        id: changelog_reader
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.tag_name.outputs.current_version }}
        run: |
          version="${CURRENT_VERSION}"
          changelog_path="./CHANGELOG.md"
          changes_file="$(mktemp)"

          awk -v version="$version" '
            BEGIN {
              heading = "## [" version "]"
            }
            $0 == heading || index($0, heading " ") == 1 {
              in_section = 1
              next
            }
            in_section && /^## / {
              exit
            }
            in_section {
              lines[++line_count] = $0
            }
            END {
              first = 1
              while (first <= line_count && lines[first] ~ /^[[:space:]]*$/) {
                first++
              }
              while (line_count >= first && lines[line_count] ~ /^[[:space:]]*$/) {
                line_count--
              }
              for (i = first; i <= line_count; i++) {
                print lines[i]
              }
            }
          ' "$changelog_path" > "$changes_file"

          if ! grep -q '[^[:space:]]' "$changes_file"; then
            echo "No changelog entry found for $version in $changelog_path" >&2
            exit 1
          fi

          delimiter="CHANGELOG_$(date +%s%N)"
          {
            echo "version=$version"
            echo "status=released"
            echo "changes<<$delimiter"
            cat "$changes_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create/update release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0 # zizmor: ignore[superfluous-actions] richer release handling (allowUpdates, changelog body, draft/prerelease) than gh release
        with:
          tag: v${{ steps.changelog_reader.outputs.version }}
          name: Release v${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
          allowUpdates: true
          token: ${{ github.token }}

      - name: Comment on released issues and pull requests
        if: steps.changelog_reader.outputs.status == 'released'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.changelog_reader.outputs.version }}
          RELEASE_NAME: Release v${{ steps.changelog_reader.outputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.changelog_reader.outputs.version }}
        shell: bash
        run: bash .github/scripts/comment-release-targets.sh

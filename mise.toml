[settings]
experimental = true
minimum_release_age = "1d"
npm.package_manager = "bun"
pipx.uvx = true

[tools]
"pipx:yt-dlp" = "latest"

bun = "1"
ffmpeg = "9"
gh = "2"
hk = "2.7.0"
node = "24"
pkl = "0.32"
usage = "latest"
uv = "0.13"

[env]
PROJECT_ROOT = "{{config_root}}"

[hooks]
enter = ["hk install --mise"]
